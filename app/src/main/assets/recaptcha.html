<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.google.com/recaptcha/api.js?render=6Lef7eAsAAAAAB029ppC-qaTXwT0OBR2AQIdX5z3"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            color: white;
            font-family: sans-serif;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <script>
        var SITE_KEY = "6Lef7eAsAAAAAB029ppC-qaTXwT0OBR2AQIdX5z3";

        function notifyToken(token) {
            if (window.AndroidBridge && window.AndroidBridge.onCaptchaSuccess) {
                AndroidBridge.onCaptchaSuccess(token);
            }
        }
        function notifyError() {
            if (window.AndroidBridge && window.AndroidBridge.onCaptchaError) {
                AndroidBridge.onCaptchaError();
            }
        }

        // El captcha NO se ejecuta automáticamente; se invoca desde Kotlin
        // mediante WebView.evaluateJavascript("executeRecaptcha()") cuando
        // el usuario pulsa el checkbox "No soy un robot".
        function executeRecaptcha() {
            if (typeof grecaptcha === "undefined" || !grecaptcha.execute) {
                // El script aún no ha cargado: reintentar en breve
                setTimeout(executeRecaptcha, 300);
                return;
            }
            grecaptcha.ready(function() {
                grecaptcha.execute(SITE_KEY, { action: "register" })
                    .then(function(token) { notifyToken(token); })
                    .catch(function() { notifyError(); });
            });
        }
    </script>
</body>
</html>
